<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Product Form</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<nav class="nav">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/products.html">Products</a>
    <button id="logoutBtn" class="btn-link">Logout</button>
</nav>
<div class="container">
    <h2 id="formTitle">Add Product</h2>
    <form id="productForm" class="card">
        <input type="hidden" id="productId">
        <label>Name</label>
        <input id="name" required>
        <label>Category</label>
        <input id="category" required>
        <label>Quantity</label>
        <input type="number" min="0" id="quantity" required>
        <label>Price</label>
        <input type="number" min="0.01" step="0.01" id="price" required>
        <button type="submit">Save</button>
    </form>
    <p id="message"></p>
</div>
<script src="/js/common.js"></script>
<script src="/js/product-form.js"></script>
</body>
</html>
